; Quanta Altair Controller - PlatformIO project

[platformio]
default_envs = esp32dev
; Open this folder in VS Code with the PlatformIO extension, then use Build / Upload.
;   pio run                 build
;   pio run -t upload       build and flash over USB
;   pio device monitor      serial log (115200)

[env:esp32dev]
platform = espressif32@^6.9.0          ; Arduino-ESP32 2.0.x - the tested build
board = esp32dev                        ; ESP32-DevKitC / ESP-WROOM-32, 4 MB flash
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv ; two app slots for over-the-air updates
board_build.flash_mode = dio            ; works on every ESP32 module
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
build_flags = -Wall
; To rebuild the web page automatically after editing ui/index.html,
; put tools/embed_ui.py in the project and uncomment the next line:
; extra_scripts = pre:tools/embed_ui.py